name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            p7zip

      - name: Download wxWidgets
        run: |
          curl -fL -o wx.7z "https://github.com/wxWidgets/wxWidgets/releases/download/v3.2.11/wxMSW-3.2.11_gcc1420UCRT_x64_Dev.7z"
          7z x wx.7z -o/c/wx -y > /dev/null
          CORE=$(find /c/wx/lib -maxdepth 2 -name "libwxmsw32u_core.a" | head -n1)
          LIBDIR=$(dirname "$CORE")
          VER=$(find /c/wx -name version.h -path "*/wx/version.h" | head -n1)
          echo "found version.h at $VER"
          INC=$(dirname "$(dirname "$VER")")
          WXROOT=$(dirname "$INC")
          mkdir -p "$LIBDIR/mswu/wx"
          cp "$VER" "$LIBDIR/mswu/wx/version.h"
          echo "found WXROOT=$WXROOT"
          echo "found WXLIB=$LIBDIR"
          echo "WXROOT=$WXROOT" >> "$GITHUB_ENV"
          echo "WXLIB=$LIBDIR" >> "$GITHUB_ENV"

      - name: Configure
        run: |
          echo "WXROOT=$WXROOT"
          echo "WXLIB=$WXLIB"
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DwxWidgets_ROOT_DIR="$(cygpath -m "$WXROOT")" \
            -DwxWidgets_LIB_DIR="$(cygpath -m "$WXLIB")" \
            -DwxWidgets_CONFIGURATION=mswu

      - name: Build
        run: |
          cmake --build build -j
          cp /ucrt64/bin/libstdc++-6.dll build/
          cp /ucrt64/bin/libgcc_s_seh-1.dll build/
          cp /ucrt64/bin/libwinpthread-1.dll build/

      - name: Package
        run: |
          mkdir -p stage
          cp build/IzakayaCheater.exe stage/
          cp build/WebView2Loader.dll stage/
          cp -r build/web stage/web
          cp /ucrt64/bin/libstdc++-6.dll stage/
          cp /ucrt64/bin/libgcc_s_seh-1.dll stage/
          cp /ucrt64/bin/libwinpthread-1.dll stage/
          cd stage
          7z a "../IzakayaCheater-${GITHUB_REF_NAME}-win64.zip" . > /dev/null

      - name: Build installer
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $iscc = (Get-ChildItem "C:\Program Files (x86)\Inno Setup*" -Filter ISCC.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
          if (-not $iscc) { throw "ISCC.exe not found" }
          & $iscc installer\installer.iss

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            IzakayaCheater-*.zip
            dist/IzakayaCheater-Setup-*.exe
          generate_release_notes: true
          draft: false

      - name: Upload artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: IzakayaCheater-win64
          path: IzakayaCheater-*.zip
