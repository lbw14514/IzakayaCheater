name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  save-editor-byte:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: >-
            mingw-w64-ucrt-x86_64-gcc

      - name: Build byte test
        run: |
          g++ -std=c++17 -O2 -static -static-libgcc -static-libstdc++ -I. \
            tests/save_editor_byte_test.cpp \
            save_editor.cpp json_lite.cpp backup_manager.cpp \
            -ladvapi32 -lbcrypt -lshell32 \
            -o save_editor_byte_test.exe
          ./save_editor_byte_test.exe tests/fixtures/source.memory

  web-syntax:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check app.js
        shell: pwsh
        run: node --check web/app.js
